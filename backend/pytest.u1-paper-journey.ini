[pytest]
testpaths = ../tests/u1_integrated_paper_journey
pythonpath = ..
addopts = --strict-markers --strict-config -ra
markers =
    u1_component: focused U1 owner behavior
    u1_database: real PostgreSQL runtime role behavior
    u1_repository: persistent repository behavior
    u1_integration: mounted application and worker boundary
    u1_model: actual local model quality
    u1_operations: actual bounded restart and recovery
    u1_contracts: generated producer and consumer bindings
asyncio_mode = auto
