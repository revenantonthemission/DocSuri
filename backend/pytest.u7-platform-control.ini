[pytest]
testpaths = ../tests/u7_controlled_platform_protocols
pythonpath = .. ../ops/src ../scripts
addopts = --strict-markers --strict-config -ra
markers =
    u7_component: focused U7 owner behavior
    u7_database: real PostgreSQL runtime role behavior
    u7_repository: persistent repository behavior
    u7_integration: mounted CLI boundary
    u7_operations: bounded restart and recovery
asyncio_mode = auto
