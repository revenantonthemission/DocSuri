[pytest]
testpaths = ../tests/u3_paper_corpus_capabilities
pythonpath = .. ../ingestion/src ../ops/src
addopts = --strict-markers --strict-config -ra
markers =
    u3_component: focused U3 owner behavior with bounded doubles
    u3_database: real PostgreSQL owner constraints, CAS and atomicity
    u3_repository: owner persistence, paging, receipts and read-only recovery
    u3_integration: mounted host through the real browser boundary and stores
    u3_operations: bounded operational/fault families with resumable evidence
asyncio_mode = auto
faulthandler_timeout = 60
