[pytest]
testpaths = ../tests/u2_account_personal_controls
pythonpath = .. ../ingestion/src ../ops/src
addopts = --strict-markers --strict-config -ra
markers =
    u2_component: focused U2 owner behavior
    u2_database: real PostgreSQL owner constraints and atomicity
    u2_repository: owner persistence and read-only rediscovery
    u2_integration: mounted application with actual owner stores
    u2_operations: bounded profile, recovery and diagnostics
asyncio_mode = auto
faulthandler_timeout = 30
