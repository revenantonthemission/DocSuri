// Local SQS stand-in (ElasticMQ) — mirrors the six DocSuri queue pairs that lived in
// AWS account 559352512800 until the 2026-08-17 full-local migration. Names must match
// the old queues exactly so DOCSURI_*_QUEUE_URL values only change host, not path.
include classpath("application.conf")

node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  docsuri-ingestion-queue { deadLettersQueue { name = "docsuri-ingestion-dlq", maxReceiveCount = 3 } }
  docsuri-ingestion-dlq {}
  docsuri-docmodel-queue { deadLettersQueue { name = "docsuri-docmodel-dlq", maxReceiveCount = 3 } }
  docsuri-docmodel-dlq {}
  docsuri-userdoc-queue { deadLettersQueue { name = "docsuri-userdoc-dlq", maxReceiveCount = 3 } }
  docsuri-userdoc-dlq {}
  docsuri-summary-job-queue { deadLettersQueue { name = "docsuri-summary-job-dlq", maxReceiveCount = 3 } }
  docsuri-summary-job-dlq {}
  docsuri-evidence-agent-job-queue { deadLettersQueue { name = "docsuri-evidence-agent-job-dlq", maxReceiveCount = 3 } }
  docsuri-evidence-agent-job-dlq {}
  docsuri-novelty-agent-job-queue { deadLettersQueue { name = "docsuri-novelty-agent-job-dlq", maxReceiveCount = 3 } }
  docsuri-novelty-agent-job-dlq {}
}
