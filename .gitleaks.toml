# Gitleaks configuration for the CI secret scan (.github/workflows/ci.yml).
# Keep gitleaks' default rules and default allowlist, and add only the two reviewed placeholder
# values below. They match the detected secret itself (the default target, NOT the whole line),
# so a real secret elsewhere on the same line, or anywhere else, is still reported.
title = "DocSuri gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Reviewed false positives (2026-10-19)"
regexes = [
  # Public capability reason code in backend/modules/accounts/control_policy.py, not a credential.
  '''^G1-policy-unresolved$''',
  # Fixed test realm id placeholder in ops/tests/test_u1_db_bootstrap.py and
  # tests/u7_controlled_platform_protocols/component/test_executor.py, test_native_adapter.py.
  '''^0123456789abcdef$''',
]
