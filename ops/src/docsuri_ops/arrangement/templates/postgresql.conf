# ${prefix}/postgres/data/postgresql.conf: v2's PostgreSQL 16.14 instance
# (tech-stack-decisions § Configuration, infrastructure-specification § 2,
# security-design § 6.3 and § 7.2). Arrangement version ${version}.

# Connections: loopback only, the private socket folder, no TLS. The root-owned launch job
# repeats the four connection settings below with `-c` on its command line, and names
# hba_file and ident_file (root's, in ${prefix}/postgres-rules) and an empty
# shared_preload_libraries the same way. The command line outranks this file and
# postgresql.auto.conf (both the database account's to write), so neither can point the
# server at another rule file or load a library into it.
listen_addresses = '127.0.0.1'
port = 15432
unix_socket_directories = '${prefix}/postgres/socket'
unix_socket_permissions = 0700
ssl = off
max_connections = 50

# Authentication: SCRAM only (pg_hba.conf), the superuser over the socket only.
password_encryption = scram-sha-256

# Memory.
shared_buffers = 512MB
work_mem = 16MB
maintenance_work_mem = 256MB

# Write-ahead log: bounded, no archiving, no replication.
max_wal_size = 1GB
wal_keep_size = 0
archive_mode = off
max_replication_slots = 0
max_wal_senders = 0

# Server log: daily dated files in log/ inside the data folder, which the rotation job
# only deletes after 14 days; no statement, parameter or client error text (NFR3.9).
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 0
log_min_messages = log
log_error_verbosity = terse
log_min_error_statement = panic
log_statement = 'none'
log_min_duration_statement = -1
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0

# Locale: databases are created with ENCODING 'UTF8' and LOCALE 'C'.
lc_messages = 'C'
timezone = 'UTC'
