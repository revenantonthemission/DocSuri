# ${rules}/pg_hba.conf: three lines, in this order (security-design § 6.3).
# The superuser has no password: only over the socket, only as the database account,
# through the one peer map in pg_ident.conf beside this file. Root's, in a root-owned
# folder: the database account can read it but neither write nor replace it.
local all ${superuser} peer map=${superuser_map}
host all ${superuser} 127.0.0.1/32 reject
host all all 127.0.0.1/32 scram-sha-256
