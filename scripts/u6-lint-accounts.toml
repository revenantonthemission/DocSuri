# The four U2 files U6 changes in backend/modules/accounts (Build and Test loop-back 3,
# L3-10 (A); cicd-pipeline §2.3): the folder's own configuration with E, F, I, UP and B and
# nothing ignored. Run from that folder with `--config ../../../scripts/u6-lint-accounts.toml`
# over control_keys.py, services/control_lifecycle.py, local_http.py and
# services/guarded_entry.py.
extend = "../backend/modules/accounts/ruff.toml"
line-length = 100
target-version = "py313"

[lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []
