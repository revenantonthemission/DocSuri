# First CI for DocSuri — closes the "no automated gate" finding (aidlc-state.md §검증 재기준선).
# One job per uv project (they are independent packages). Each runs lint + tests; `shared` also
# runs the schema drift guard so a stale _generated/ fails the PR. The repo-root tests/ suite
# (accounts U3 + library U4) runs in the `root-suites` job below; that job's lint step also gates
# the tests/ tree so unused-import (F401) debt can't reappear invisibly.
#
# Third-party actions are pinned to a commit SHA (not a mutable major tag) — a hijacked tag can't
# silently run in CI. The trailing `# vX` comment records the human-readable version. (audit Med #6)
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  # Nightly: the release Hypothesis profile (2,000 examples / 200x100 stateful) is far too slow
  # for a PR gate, so it runs on a schedule instead of being quietly downgraded on every PR.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref so a rapid push train doesn't stack full CI runs. (audit Low #8)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every hypothesis failure is reproducible; shrinking remains enabled.
  PYTEST_ADDOPTS: --hypothesis-seed=20260924
  R1_TEST_PROFILE: pr

jobs:
  platform-integrity:
    name: REM-1 isolated rules and adapters
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: platform_integrity
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - run: uv sync --frozen --all-extras --python 3.13
      - run: uv run --frozen --all-extras ruff check .
      - run: uv run --frozen --all-extras pytest
  shared:
    name: shared (SSOT · drift · pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: shared/python
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Schema drift guard (generated bindings match the SSOT)
        run: uv run --frozen python tools/generate.py --check
      - name: Actual Python consumer inventory
        run: uv run --frozen python tools/inventory_consumers.py
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Tests
        run: uv run --frozen pytest

  ingestion:
    name: ingestion (U1)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ingestion
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Lint
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest

  discovery:
    name: discovery (U2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/modules/discovery
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Lint
        run: uv run ruff check .
      - name: Tests (incl. the api router extra)
        run: uv run --extra api pytest

  summarization:
    name: summarization (U7)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/modules/summarization
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Lint
        run: uv run ruff check .
      # --all-extras, not `--extra api` like discovery: test_docmodel_endpoint.py imports the S3
      # adapter (botocore, from the `real` extra) at collection time and does NOT self-skip when
      # it's absent. The live-service integration tests still self-skip without credentials.
      - name: Tests (needs the `real` extra — s3_docmodel imports botocore)
        run: uv run --all-extras pytest

  ops:
    name: ops (U6 reliability/detection)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ops
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Lint
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest

  backend:
    name: backend app-shell (mounts U2/U3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Lint
        run: uv run ruff check .
      - name: Tests (asserts discovery actually mounts)
        run: uv run pytest

  root-suites:
    name: accounts + library (root tests/ — U3 · U4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      # Root tests/ (accounts U3 + library U4) import backend.modules.* and need the backend
      # env (incl. hypothesis + pytest-asyncio). Run from the repo root via the root pytest.ini
      # (pythonpath=. · asyncio_mode=auto). The accounts/library/ops module lanes self-lint with
      # their own ruff.toml (the app-shell ruff excludes modules/), so gate them here — plus the
      # root tests/ tree itself, which no other lane covered (ruff defaults catch F401 there).
      - name: Lint (accounts + library + ops modules + root tests/)
        run: uv run --project backend ruff check backend/modules/accounts backend/modules/library backend/modules/ops tests
      - name: Tests (accounts + library)
        run: uv run --project backend pytest tests -c pytest.ini

  frontend:
    name: frontend (U5 · tsc + vitest + type drift + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
        with:
          version: 9.15.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: TypeScript check
        run: pnpm exec tsc --noEmit
      - name: Type drift guard (generated types match shared/ schemas)
        run: pnpm run check:types && pnpm run check:consumers && pnpm run test:contracts
      - name: Production dependency audit (full frozen tree)
        run: pnpm audit --prod --audit-level high
      - name: Lint
        run: pnpm run lint
      - name: Tests
        run: pnpm exec vitest run
      # tsc + vitest don't webpack-compile the routes, so a build-only break (e.g. a
      # server-only module leaking into the client graph via the /bff route) passes both
      # yet fails `next build`. This step is the guard that actually compiles every route.
      - name: Build
        run: pnpm exec next build

  dependency-review:
    name: Dependency review (PR-only · npm + pip)
    # Reviews the PR's dependency-graph diff (pnpm + Python) and fails only on a NEWLY introduced
    # vulnerable dependency — closes the frontend-deps-unscanned gap without blocking on
    # pre-existing debt. Public repo, so no Advanced Security needed. PR-only (no base ref on push).
    # (audit Med #5)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high

  security:
    name: Security Scan (SCA + Secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Run pip-audit on Backend
        run: |
          uv export --project backend --frozen --no-dev --no-emit-workspace --no-emit-package docsuri-shared --no-emit-package docsuri-discovery --no-emit-package docsuri-summarization --no-emit-package docsuri-ops -o backend/requirements.audit.txt
          uvx pip-audit==2.10.1 -r backend/requirements.audit.txt
      - name: Run pip-audit on Ingestion
        run: |
          uv export --project ingestion --frozen --all-extras --no-dev --no-emit-workspace --no-emit-package docsuri-shared -o ingestion/requirements.audit.txt
          uvx pip-audit==2.10.1 -r ingestion/requirements.audit.txt
      - name: Run pip-audit on Ops
        run: |
          uv export --project ops --frozen --no-dev --no-emit-workspace --no-emit-package docsuri-shared -o ops/requirements.audit.txt
          uvx pip-audit==2.10.1 -r ops/requirements.audit.txt
      # BLOCKING, license-free secret scan. The gitleaks-action v2 needs an org licence (why the
      # old step was continue-on-error/advisory), so run the gitleaks CLI via its pinned image and
      # fail on any finding. --no-git scans the CURRENT tree (what this PR delivers) rather than
      # full history, so it gates new secrets without red-flagging pre-existing history leaks (which
      # need rotation + a history scrub, not a merge block). Allowlist false positives in
      # .gitleaks.toml; tighten to PR-range history later if wanted. (audit Med #4)
      - name: Gitleaks secret scan (blocking)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source /repo --no-git --redact -v --exit-code 1

  # Step 15. The `dependency-review` job above is PR-diff-only by design: it fails on a NEWLY
  # introduced vulnerable dependency and ignores pre-existing debt. That is correct for a PR gate
  # but is NOT a closure audit, so the full production/tool closure is re-checked here on every
  # push and on the nightly schedule regardless of the diff.
  rem1-closure-audit:
    name: REM-1 full closure audit (not diff-only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      # Every deploy and tool project is exported and audited in full, not only what a PR touched.
      # Projects are discovered rather than listed so a new pyproject cannot silently escape the
      # closure audit. backend/ingestion/ops are already gated by the `security` job; the projects
      # marked PENDING below are audited and reported but not yet blocking, because their CVE
      # disposition (CVE-2026-82049, CVE-2026-85091) is still an open operator item. They are kept
      # visible here on purpose: silently dropping them is how a closure audit rots.
      - name: Full-closure pip-audit (all deploy + tool projects)
        run: |
          set -uo pipefail
          pending=" backend/modules/discovery backend/modules/summarization platform_integrity shared/python tools/aidlc-codereview tools/aidlc-designreview tools/aidlc-traceability "
          failed=0
          while IFS= read -r pyproject; do
            project="$(dirname "$pyproject")"
            echo "::group::$project"
            if ! uv export --project "$project" --frozen --all-extras --no-dev \
                 -o "/tmp/$(echo "$project" | tr '/' '_').audit.txt"; then
              echo "::error::$project failed to export a frozen closure"
              echo "::endgroup::"; failed=1; continue
            fi
            if uvx pip-audit==2.10.1 -r "/tmp/$(echo "$project" | tr '/' '_').audit.txt"; then
              echo "clean"
            elif [[ "$pending" == *" $project "* ]]; then
              echo "::warning::$project has un-dispositioned findings (PENDING operator item)"
            else
              echo "::error::$project has a closure finding"
              failed=1
            fi
            echo "::endgroup::"
          done < <(find . -name pyproject.toml -not -path '*/.venv/*' -not -path './.git/*' | sort)
          exit "$failed"
      # A declared image without an immutable digest is a mutable deployment input. The script is
      # stdlib-only, so it runs under the runner's python3 with no project sync, and is the same
      # code path covered by ops/tests/test_supply_chain_targets.py.
      - name: Declared images are digest-pinned
        run: |
          python3 ops/platform-integrity/validate_supply_chain.py \
            ops/platform-integrity/sbom-targets.json

  # Step 15. Release Hypothesis profile: 2,000 examples and 200x100 stateful. conftest.py reads
  # R1_TEST_PROFILE, so this is the same suite at the stronger profile, not a different suite.
  pbt-full:
    name: REM-1 PBT Full (2,000 examples)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Platform integrity at release profile
        working-directory: platform_integrity
        env:
          R1_TEST_PROFILE: release
        run: |
          uv sync --frozen --all-extras --python 3.13
          uv run --frozen --all-extras pytest -p no:randomly
      - name: Ops at release profile
        working-directory: ops
        env:
          R1_TEST_PROFILE: release
        run: uv run --frozen pytest


  # Step 15. The 185 isolated Postgres tests skip on every other lane, so a green CI has never
  # actually exercised them. This lane provisions the container the harness contract expects
  # (fixed name, fixed role/db) and turns those skips into real assertions. The name and the
  # role are asserted inside the tests themselves, so a drifted lane fails loudly rather than
  # quietly skipping.
  rem1-isolated:
    name: REM-1 isolated Postgres acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REM1_TEST_CONTAINER: rem1-test-pg-20260924
    services:
      postgres:
        # Digest-pinned: a mutable tag would make the acceptance lane non-reproducible.
        image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: rem1_test
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: rem1_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rem1_test -d rem1_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Link the service under the name the harness asserts
        # The mtls/recovery tests exec into a container by this exact name, which a service
        # container does not provide on its own.
        run: |
          set -euo pipefail
          sudo docker ps -q --filter "ancestor=postgres" | head -1
          cid="$(sudo docker ps -q --filter "ancestor=postgres" | head -1)"
          test -n "$cid" || { echo "::error::no postgres service container found"; exit 1; }
          sudo docker rename "$cid" "$REM1_TEST_CONTAINER"
          sudo docker exec "$REM1_TEST_CONTAINER" pg_isready -U rem1_test -d rem1_test
      - name: Platform integrity with isolated Postgres
        working-directory: platform_integrity
        env:
          REM1_TEST_PG_DSN: postgresql://rem1_test:isolated-test-only@127.0.0.1:5432/rem1_test
          REM1_TEST_CONTAINER: rem1-test-pg-20260924
        run: |
          uv sync --frozen --all-extras --python 3.13
          uv run --frozen --all-extras pytest -rs --tb=short
      - name: Isolated lane must not pass vacuously
        # The skipif on these tests is evaluated at RUNTIME, so a collection count proves
        # nothing: with a broken DSN they still collect and then all skip, leaving the lane
        # green. The only honest check is to run them and require zero skips.
        working-directory: platform_integrity
        env:
          REM1_TEST_PG_DSN: postgresql://rem1_test:isolated-test-only@127.0.0.1:5432/rem1_test
          REM1_TEST_CONTAINER: rem1-test-pg-20260924
        run: |
          set -uo pipefail
          uv run --frozen --all-extras pytest -m integration -rs -o addopts="" --tb=short \
            | tee /tmp/isolated.log
          rc=${PIPESTATUS[0]}
          if grep -q '^SKIPPED' /tmp/isolated.log; then
            echo "::error::isolated lane skipped tests; the DSN did not reach them"
            grep '^SKIPPED' /tmp/isolated.log | head -20
            exit 1
          fi
          if ! grep -qE '[1-9][0-9]* passed' /tmp/isolated.log; then
            echo "::error::isolated lane reported no passes; refusing to call this a pass"
            exit 1
          fi
          exit "$rc"

  # Step 15. The generation boundary and backup/collection evidence depend on hardlink, symlink
  # and rename semantics that differ between APFS and the Linux container filesystem. The ubuntu
  # lanes above cannot observe a difference, so the platform suite also runs on macOS.
  macos-filesystem:
    name: REM-1 platform suite on macOS (APFS semantics)
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: platform_integrity
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Full suite on APFS
        run: |
          uv sync --frozen --all-extras --python 3.13
          uv run --frozen --all-extras pytest --tb=short
      - name: Ops suite on APFS
        working-directory: ops
        run: uv run --frozen pytest
