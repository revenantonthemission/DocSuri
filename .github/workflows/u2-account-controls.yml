name: U2 account and personal controls

on:
  pull_request:
    branches: [develop]
    paths:
      - 'backend/**'
      - 'ops/src/docsuri_ops/**'
      - 'shared/**'
      - 'frontend/src/**'
      - 'frontend/test/**'
      - 'frontend/e2e/**'
      - 'frontend/package.json'
      - 'frontend/pnpm-lock.yaml'
      - 'frontend/*u2*'
      - 'scripts/*docsuri_u2*.py'
      - 'scripts/u2_browser_fixtures.py'
      - 'tests/u2_account_personal_controls/**'
      - '.github/workflows/u2-account-controls.yml'
  workflow_dispatch:

permissions:
  contents: read

# Standard public-repository runners only. No self-hosted runner, cloud
# credentials, public deployment or privileged pull_request_target execution.
concurrency:
  group: u2-controls-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'
      - run: corepack enable
      - name: Frozen frontend dependencies
        run: corepack pnpm@9.15.9 --dir frontend install --frozen-lockfile --ignore-scripts
      - name: Workspace typecheck
        working-directory: frontend
        run: >-
          corepack pnpm@9.15.9 exec tsc --noEmit --strict --jsx react-jsx
          --module esnext --moduleResolution bundler --target ES2022
          --lib dom,dom.iterable,ES2022 --skipLibCheck src/main.tsx
      - name: Execute U1 and U2 frontend checks with coverage
        working-directory: frontend
        run: corepack pnpm@9.15.9 exec vitest run --config vitest.u2-cumulative.config.ts --coverage
      - name: Build shared workspace
        run: corepack pnpm@9.15.9 --dir frontend exec vite build

  owners:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        phase: [database, repository, component, integration, operations]
    env:
      DOCSURI_U2_ENVIRONMENT_FILE: /tmp/docsuri-u2-run/environment.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: '0.9.0'
      - name: Frozen Python dependencies
        run: uv sync --project backend --frozen --python 3.13.7
      - name: Pinned free local database image
        run: docker pull postgres@sha256:a3b7f434b2dc57ce85a67e171163eb8ab1a1ebcb39d27484661f26b1dfbe30d6
      - name: Create isolated synthetic realm
        run: >-
          backend/.venv/bin/python scripts/verify_docsuri_u2.py
          --phase setup --profile synthetic-local
          --environment-file "$DOCSURI_U2_ENVIRONMENT_FILE"
      - name: Apply verified ordered migrations
        run: >-
          backend/.venv/bin/python scripts/verify_docsuri_u2.py
          --phase migrate --profile synthetic-local
          --environment-file "$DOCSURI_U2_ENVIRONMENT_FILE"
      - name: Execute owner checks (zero tests or skips fail)
        run: >-
          backend/.venv/bin/python scripts/verify_docsuri_u2.py
          --phase "${{ matrix.phase }}" --profile synthetic-local
          --environment-file "$DOCSURI_U2_ENVIRONMENT_FILE"
      - name: Evidence boundary
        if: always()
        run: >-
          echo "Each matrix job has an independent disposable synthetic realm.
          Browser journeys, cumulative completion verification and public-provider
          activation remain separate evidence. Private logs, keys, proofs and
          database backups are never uploaded as CI artifacts."
